name: build-elf

# 在 GitHub 托管的 Ubuntu runner 上构建 Linux x86_64 ELF 并上传为构建产物。
# 触发：手动 dispatch，或推送到 botbattle/poker_bot.py / 本文件时自动。
on:
  workflow_dispatch: {}
  push:
    paths:
      - 'botbattle/poker_bot.py'
      - '.github/workflows/build-elf.yml'

permissions:
  contents: write      # 供下面「发布 raw ELF 到 Release」步骤使用

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 【2026-09-11】把 git 短 SHA 打进 ELF，并体现在产物名里——
      # 这样「下载的是哪一版」可以肉眼自证（压缩包名带 hash），
      # 机器人 stderr 日志首行也会打印 [BOT_VERSION] <sha>。
      - name: Stamp version (git short SHA)
        run: |
          SHA=$(git rev-parse --short=7 HEAD)
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          sed -i "s/^BOT_VERSION = .*/BOT_VERSION = \"$SHA\"/" botbattle/poker_bot.py
          echo "--- 打版本后确认 ---"
          grep -n '^BOT_VERSION' botbattle/poker_bot.py

      # 【2026-09-24 重要】精确锁定 PyInstaller == 6.22.2，不要再用 >=6.10,<7 的浮动区间。
      #
      # 实证（三层证据，均指向 6.22.3 是回归引入点）：
      #  1) PyPI 上传时间：6.22.2 上传于 2026-08-17，**6.22.3 上传于 2026-09-12**。
      #     浮动区间在 09-11 解析到 6.22.2、在 09-24 解析到 6.22.3。
      #  2) 二进制字符串对比（引导器区）：09-24 判负的 ELF 比 09-11 能跑的 ELF 多出
      #     pyi-enable-onefile-parent-verification / security.capability / getxattr /
      #     /proc/%u/stat / originating onefile parent / _MEI%08x。
      #  3) 逐版本扫描 PyInstaller sdist 的 bootloader 源码：
      #       6.21.0 / 6.22.0 : 无 pyi_security.c
      #       6.22.1 / 6.22.2 : 有 pyi_security.c，但**没有**父进程校验
      #       6.22.3          : 新增 pyi_security_verify_onefile_parent_pid /
      #                         ..._parent_executable / ..._application_home_dir_name
      #                         —— 子进程会经 /proc/<pid>/stat 追父进程链、
      #                         比对父进程可执行文件路径、解析 _MEI%08x 目录名、
      #                         并读 security.capability xattr 决定是否强制校验；
      #                         任一步不满足即 "Security validation failure" 并退出。
      # 平台侧表现：进程秒退（stdout EOF、退出码 255＝引导器 return -1），
      # 对局直接 technical_loss（第 0 手、0 个动作）。这套校验在受限沙箱/受限 procfs
      # 的容器里非常容易触发，故锁回**实测在平台上跑过整套对局**的 6.22.2。
      - name: Install PyInstaller (pinned to 6.22.2)
        run: |
          pip install "pyinstaller==6.22.2"
          echo "PyInstaller 版本: $(pyinstaller --version)"

      - name: Build single-file ELF
        working-directory: botbattle
        run: |
          pyinstaller --onefile --strip --clean --name poker_bot poker_bot.py
          chmod +x dist/poker_bot
          file dist/poker_bot
          ls -lh dist/poker_bot

      - name: 构建环境与平台兼容性报告
        working-directory: botbattle
        run: |
          echo "=== runner 环境 ==="
          uname -a
          ldd --version | head -1
          python -V
          echo "=== ELF 动态依赖 ==="
          ldd dist/poker_bot || true
          echo "=== ELF 要求的最高 GLIBC 符号版本（平台镜像低于此值则无法运行）==="
          readelf --version-info dist/poker_bot 2>/dev/null \
            | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -3 || true
          echo "=== 引导器特性守卫（应为“未发现”）==="
          if grep -aq 'pyi-enable-onefile-parent-verification' dist/poker_bot; then
            echo "!! 失败：产物含 onefile 父进程校验代码（PyInstaller >= 6.22.3 引入），"
            echo "!!       该机制已在平台上导致 technical_loss。请检查上面打印的 PyInstaller 版本。"
            exit 1
          else
            echo "OK：未发现 onefile 父进程校验代码"
          fi

      - name: 冒烟自检（真跑 ELF，必须应答）
        working-directory: botbattle
        run: |
          REQ1='{"requests":[{"num_players":2,"dealer_id":0,"my_id":0,"my_chips":19950,"my_cards":[50,11],"public_cards":[],"history":[],"hand":0,"max_hand":70,"total_win_chips":[0,0],"total_win_games":[0,0]}],"data":"","globaldata":""}'
          REQ2='{"requests":[{"num_players":2,"dealer_id":0,"my_id":0,"my_chips":19000,"my_cards":[50,11],"public_cards":[30,48,24,16,22],"history":[{"round":0,"player_id":0,"action":100,"action_type":"raise"},{"round":0,"player_id":1,"action":100,"action_type":"call"},{"round":1,"player_id":0,"action":0,"action_type":"check"},{"round":1,"player_id":1,"action":200,"action_type":"raise"},{"round":2,"player_id":0,"action":0,"action_type":"check"},{"round":2,"player_id":1,"action":200,"action_type":"raise"},{"round":3,"player_id":0,"action":0,"action_type":"check"},{"round":3,"player_id":1,"action":192,"action_type":"raise"}],"hand":50,"max_hand":70,"total_win_chips":[914,-914],"total_win_games":[0,0]}],"data":"","globaldata":""}'
          printf '%s\n' "$REQ1" "$REQ2" > smoke_req.jsonl
          set +e
          timeout 90 ./dist/poker_bot < smoke_req.jsonl > smoke_out.txt 2> smoke_err.txt
          RC=$?
          set -e
          echo "退出码 = $RC"
          echo "--- stdout ---"
          cat smoke_out.txt
          echo "--- stderr（前 8 行）---"
          head -8 smoke_err.txt || true
          N=$(grep -c '"response"' smoke_out.txt || true)
          echo "合法应答行数 = $N（应为 2）"
          if [ "$N" != "2" ]; then
            echo "冒烟自检失败：ELF 未正常应答"
            exit 1
          fi
          if grep -q 'Traceback' smoke_err.txt; then
            echo "冒烟自检失败：stderr 出现 Traceback"
            exit 1
          fi
          if ! grep -q '\[REQ\] hand=' smoke_err.txt; then
            echo "冒烟自检失败：未打印请求日志（决策链可能没跑起来）"
            exit 1
          fi
          echo "冒烟自检通过：ELF 能解析请求并输出合法应答"

      - name: 老发行版兼容性探测（非阻塞，仅供对照）
        continue-on-error: true
        working-directory: botbattle
        run: |
          echo "=== debian:11（glibc 2.31）==="
          docker run --rm -v "$PWD:/w" -w /w debian:11 \
            sh -c "timeout 90 ./dist/poker_bot < smoke_req.jsonl | head -2 \
                   && echo '可运行' || echo '不可运行'"

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: poker_bot-linux-x86-64-${{ env.SHA }}
          path: botbattle/dist/poker_bot
          if-no-files-found: error
          retention-days: 90

      # 【2026-09-24】artifact 的浏览器下载在用户机器上**反复得到 22 字节空 zip**
      # （多个构建都是 22 字节 = 只有 EOCD 的空压缩包），导致拿不到 ELF。
      # 这里额外把同一个 ELF 作为 **Release 原始附件**发布（不是 zip），
      # 提供第二条下载通道：Releases 页面直接下载 poker_bot。
      # 失败不阻塞构建（continue-on-error）。
      - name: 发布 raw ELF 到 Release（备用下载通道）
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="elf-${{ env.SHA }}"
          NOTES="PyInstaller $(cd botbattle && pyinstaller --version 2>/dev/null || echo '?') / py3.11 / commit ${{ env.SHA }}"
          gh release create "$TAG" \
            botbattle/dist/poker_bot \
            --title "ELF ${{ env.SHA }}" \
            --notes "$NOTES" \
            --latest=false || \
          gh release upload "$TAG" botbattle/dist/poker_bot --clobber
          echo "Release 附件: poker_bot（原始文件，非 zip）"
